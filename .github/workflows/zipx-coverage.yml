# Generated by zipx. Do not edit. Run 'sbt zipxWorkflowGenerate' to regenerate.
name: zipx coverage
"on":
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - labeled
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch: null
permissions:
  contents: read
concurrency:
  group: zipx-coverage-${{ github.ref }}
  cancel-in-progress: true
jobs:
  zipx-env-image:
    name: Publish zipx env image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      GITHUB_TOKEN: ${{ github.token }}
    outputs:
      image: ${{ steps.zipx-env.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Publish zipx env image
        id: zipx-env
        run: |
          repo=$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')
          image="ghcr.io/${repo}/zipx-env:df-987e06aa6589de7dc293c9d3a5a7d72ebf8a087ca877a0ebb96b37a806e7bf76"
          echo "image=${image}" >> "$GITHUB_OUTPUT"
          if docker manifest inspect "$image" >/dev/null 2>&1; then
            echo "zipx-env $image is already published"
            exit 0
          fi
          printf '%s' "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker build -f .github/zipx-env/Dockerfile -t "$image" .
          docker push "$image"

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    needs:
      - zipx-env-image
    if: github.event_name != 'pull_request' || (contains(github.event.pull_request.labels.*.name, 'coverage') && (github.event.action != 'labeled' || github.event.label.name == 'coverage'))
    container: ${{ needs.zipx-env-image.outputs.image }}
    env:
      COURSIER_TTL: "0s"
      GITHUB_TOKEN: ${{ github.token }}
      HOME: /home/sbtuser
      JAVA_OPTS: -Duser.home=/home/sbtuser
      SBT_OPTS: -Duser.home=/home/sbtuser
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: "0"
          fetch-tags: "true"
      - name: zipx sbt setup
        uses: ./.github/actions/zipx-sbt-setup
        with:
          java-version: "25"
          runner-os: ubuntu-latest
          cache-key-suffix: coverage
          node-version: ""
          sbt-disk-cache: "false"
          cache-mode: restore
          purge: ${{ github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'purge') }}
          cache-epoch: dbb740c11f3404c4
          baked-toolchain: "true"
          cache-home: /home/sbtuser
          coursier: "false"
      - name: coverage
        run: sbt 'coverage; testFull; coverageAggregate'
      - name: Upload coverage report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-report
          path: "**/scoverage-report/**"
          if-no-files-found: error
