name: zipx coverage
"on":
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - labeled
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch: null
permissions:
  contents: read
concurrency:
  group: zipx-coverage-${{ github.ref }}
  cancel-in-progress: "true"
jobs:
  coverage:
    name: coverage
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || (contains(github.event.pull_request.labels.*.name, 'coverage') && (github.event.action != 'labeled' || github.event.label.name == 'coverage'))
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: "0"
          fetch-tags: "true"
      - name: zipx sbt setup
        uses: ./.github/actions/zipx-sbt-setup
        with:
          java-version: "25"
          runner-os: ubuntu-latest
          cache-key-suffix: coverage
          node-version: ""
          sbt-disk-cache: "false"
          cache-mode: restore
          cache-epoch: fd8132a86500a53a
      - name: coverage
        run: sbt 'coverage; testFull; coverageAggregate'
      - name: Upload coverage report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-report
          path: "**/scoverage-report/**"
          if-no-files-found: error
