            echo "zipx-env $image is already published"
            exit 0
          fi
          printf '%s' "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker build -f .github/zipx-env/Dockerfile -t "$image" .
          docker push "$image"

  publish-proof:
