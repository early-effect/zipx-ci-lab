# Generated by zipx. Do not edit. Run 'sbt zipxWorkflowGenerate' to regenerate.
name: zipx pin check
"on":
  schedule:
    - cron: "0 0 * * 0"
  workflow_dispatch: null
permissions:
  contents: write
  pull-requests: write
  issues: write
  packages: read
jobs:
  zipx-env-image:
    name: Publish zipx env image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      GITHUB_TOKEN: ${{ github.token }}
    outputs:
      image: ${{ steps.zipx-env.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Publish zipx env image
        id: zipx-env
        run: |
          repo=$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')
          image="ghcr.io/${repo}/zipx-env:df-8067b58b720ff3a797846716339b4b1d8f25629e9a44183a1ac1288b78c43b0f"
          echo "image=${image}" >> "$GITHUB_OUTPUT"
          if docker manifest inspect "$image" >/dev/null 2>&1; then
            echo "zipx-env $image is already published"
            exit 0
          fi
          printf '%s' "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker build -f .github/zipx-env/Dockerfile -t "$image" .
          docker push "$image"

  pin-check:
    name: Check pin feeds
    runs-on: ubuntu-latest
    needs:
      - zipx-env-image
    container: ${{ needs.zipx-env-image.outputs.image }}
    env:
      COURSIER_TTL: "0s"
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      HOME: /home/sbtuser
      JAVA_OPTS: -Duser.home=/home/sbtuser
      SBT_OPTS: -Duser.home=/home/sbtuser
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: safe.directory
      GIT_CONFIG_VALUE_0: "*"
    steps:
      - name: Detect GitHub App credentials
        id: zipx-app
        run: |
          set -euo pipefail
          if [ -n "$ZIPX_APP_ID" ] && [ -n "$ZIPX_APP_PRIVATE_KEY" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          elif [ -n "$ZIPX_APP_ID" ] || [ -n "$ZIPX_APP_PRIVATE_KEY" ]; then
            echo "zipx: ZIPX_APP_ID and ZIPX_APP_PRIVATE_KEY must both be set, or neither."
            exit 1
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          ZIPX_APP_ID: ${{ secrets.ZIPX_APP_ID }}
          ZIPX_APP_PRIVATE_KEY: ${{ secrets.ZIPX_APP_PRIVATE_KEY }}
      - name: Mint GitHub App token
        id: zipx-app-token
        if: steps.zipx-app.outputs.present == 'true'
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.ZIPX_APP_ID }}
          private-key: ${{ secrets.ZIPX_APP_PRIVATE_KEY }}
      - name: Export GitHub App token
        if: steps.zipx-app.outputs.present == 'true'
        run: |
          set -euo pipefail
          echo "GITHUB_TOKEN=$APP_TOKEN" >> "$GITHUB_ENV"
          echo "GH_TOKEN=$APP_TOKEN" >> "$GITHUB_ENV"
        env:
          APP_TOKEN: ${{ steps.zipx-app-token.outputs.token }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.zipx-app-token.outputs.token || secrets.GITHUB_TOKEN }}
          persist-credentials: "true"
      - name: zipx sbt setup
        uses: ./.github/actions/zipx-sbt-setup
        with:
          java-version: "25"
          runner-os: ubuntu-latest
          cache-key-suffix: pin-check
          node-version: ""
          sbt-disk-cache: "false"
          cache-mode: restore
          purge: ${{ github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'purge') }}
          cache-epoch: ""
          baked-toolchain: "true"
          cache-home: /home/sbtuser
          coursier: "false"
      - name: Check pin feeds
        run: sbt zipxPinCheck
      - name: Refresh generated env
        run: sbt "zipxAgentEnvGenerate; zipxSbtEnvGenerate"
      - name: Open update PR
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "No pin updates to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "zipx/pin-updates-${GITHUB_RUN_ID}"
          git add --all -- . ":!.github/workflows"
          if [ -z "$(git diff --cached --name-only)" ]; then
            echo "No pin updates to commit."
            exit 0
          fi
          git commit -m "ci: apply zipx pin feed updates"
          git push -u origin HEAD
          gh label create clean --force --description "zipx: Verify runs cleanFull" || true
          cat > /tmp/zipx-pr-body.md <<'EOF'
          Applied pin feed Update policy.
          EOF
          gh pr create --title "ci: zipx pin feed updates" --body-file /tmp/zipx-pr-body.md --head "zipx/pin-updates-${GITHUB_RUN_ID}" --label clean

