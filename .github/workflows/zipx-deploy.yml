        id: plan
        run: |
          sbt zipxDeployPlan
          printf '%s\n' "sha=$(cat target/zipx-deploy/sha)" "images=$(cat target/zipx-deploy/images.json)" "targets=$(cat target/zipx-deploy/targets.json)" >> "$GITHUB_OUTPUT"
        env:
          ZIPX_DEPLOY_MODULES: ${{ inputs.modules }}
          ZIPX_DEPLOY_REQUESTED_SHA: ${{ inputs.sha }}
          ZIPX_GITHUB_TOKEN: ${{ github.token }}
          ZIPX_DEPLOY_TARGET: ${{ inputs.target }}
