        required: true
        default: changed
        options:
          - changed
          - all
          - svcA
          - svcB
          - workerA
          - workerB
      target:
        description: Target or group to deploy to
        type: choice
        required: true
        default: prd
        options:
          - prd
          - stg
      sha:
        description: Commit to deploy (40 hex). Empty deploys the dispatched branch head.
        type: string
        required: false
